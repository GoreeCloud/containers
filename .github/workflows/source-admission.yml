name: GoreeCloud Containers source admission

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout versioned source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Validate documentation baseline and Go source admission
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          mapfile -d '' go_files < <(git ls-files -z -- '*.go')
          if (( ${#go_files[@]} > 0 )); then
            test -f go.mod || {
              echo 'Go source without tracked module is not admitted' >&2
              exit 1
            }
          elif test -f go.mod; then
            echo 'Go module without tracked Go source is not admitted' >&2
            exit 1
          fi
          if test -f go.mod; then
            test -z "$(gofmt -l "${go_files[@]}")"
            go test -race -shuffle=on ./...
            go vet ./...
            go build ./...
          else
            echo 'PASS: documentation-only baseline; native OCI runtime not implemented on main'
          fi
